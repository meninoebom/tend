name: CI

# Runs on PRs AND on push to main. The push run is required: Railway is gated on
# the CI status check before it deploys a main commit, so without a push-triggered
# `check` on the squash-merge commit, Railway waits forever and never deploys.
# (PR-only — the prior setup — silently froze prod at #183 from 2026-05-26 to
# 2026-06-04. See ~/.claude/knowledge-base/github-actions-cost-control.md)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e . --quiet
          pip install ruff pytest httpx --quiet

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Next.js build
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          INTERNAL_JWT_SECRET: ci-dummy-secret
          BACKEND_URL: http://localhost:8000
        run: npm run build
