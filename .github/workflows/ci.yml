name: CI

# Runs on PRs AND on push to main. The push run is required: Railway is gated on
# the CI status check before it deploys a main commit, so without a push-triggered
# `check` on the squash-merge commit, Railway waits forever and never deploys.
# (PR-only — the prior setup — silently froze prod at #183 from 2026-05-26 to
# 2026-06-04. See ~/.claude/knowledge-base/github-actions-cost-control.md)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tend
          POSTGRES_PASSWORD: tend
          POSTGRES_DB: tend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e . --quiet
          pip install ruff pytest httpx --quiet

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Migrate test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tend:tend@localhost:5432/tend_test
        run: alembic upgrade head

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://tend:tend@localhost:5432/tend_test
        run: pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Next.js build
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          INTERNAL_JWT_SECRET: ci-dummy-secret
          BACKEND_URL: http://localhost:8000
        run: pnpm build
