name: CI

# PR-only. The required `check` is produced by the PR run, so re-running on the
# squash-merge commit (push) was pure duplication. Railway auto-deploys from git
# push independently of Actions, so deploys are unaffected. See
# ~/.claude/knowledge-base/github-actions-cost-control.md
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e . --quiet
          pip install ruff pytest httpx --quiet

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Next.js build
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          INTERNAL_JWT_SECRET: ci-dummy-secret
          BACKEND_URL: http://localhost:8000
        run: npm run build
